# Same FQBN and core version as the real firmware's `amoled` profile, minus the
# display libraries. The board options are copied verbatim on purpose: PSRAM,
# CPUFreq and the partition scheme all change the internal-RAM picture, and a
# coexistence measurement taken under different options would not transfer.
profiles:
  amoled:
    fqbn: esp32:esp32:waveshare_esp32_s3_touch_amoled_143:UploadSpeed=921600,USBMode=hwcdc,CDCOnBoot=cdc,MSCOnBoot=default,DFUOnBoot=default,UploadMode=default,CPUFreq=240,FlashMode=qio,DebugLevel=none,PSRAM=enabled,LoopCore=1,EventsCore=1,EraseFlash=none,PartitionScheme=custom
    platforms:
      - platform: esp32:esp32 (3.3.0)
    libraries:
      - NimBLE-Arduino (2.5.0)
    programmer: ""
    port_config:
      baudrate: "115200"
